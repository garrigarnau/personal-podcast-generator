version: '3.8'

# Development override for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Backend - Development Mode
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder  # Use builder stage for dev tools
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      SQL_ECHO: "True"
    volumes:
      # Mount source code for hot-reload
      - ./backend:/app
      # Preserve installed packages
      - /app/__pycache__
      - /app/.pytest_cache
    command: >
      sh -c "
        echo 'Starting in DEVELOPMENT mode with hot-reload...' &&
        pip install --no-cache-dir watchdog &&
        /app/scripts/docker-startup.sh
      "
    ports:
      - "8000:8000"
      - "5678:5678"  # debugpy port for remote debugging

  # Frontend - Development Mode
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder  # Use builder stage for dev server
    environment:
      NODE_ENV: development
    volumes:
      # Mount source code for hot-reload
      - ./frontend:/app
      # Preserve node_modules
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"  # Vite dev server port

  # Database - Development optimizations
  db:
    # Reduce fsync for faster development (NOT for production!)
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    ports:
      - "5432:5432"  # Expose for direct access
